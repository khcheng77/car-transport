name: Deploy to GitHub Pages

# 每次 push 到下列分支即自動部署；也可在 Actions 頁面手動觸發
on:
  push:
    branches:
      - main
      - claude/initial-prototype-dev-pj1ucb
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只保留一次部署，新的推送會取消進行中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 純靜態站，整個 repo 根目錄即為網站內容（index.html 在根目錄）
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
