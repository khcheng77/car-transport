<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" id="viewport-meta">
<script>
  /* 手機（螢幕短邊 < 768px）：改用固定桌面寬度，讓整頁「等比縮放」塞進螢幕（像桌面版網站），
     避免固定側欄在窄直向把主內容壓成一行一字。平板／桌機維持原生 device-width 響應。 */
  (function () {
    var shortSide = Math.min(screen.width || 9999, screen.height || 9999);
    if (shortSide < 768) {
      var m = document.getElementById('viewport-meta');
      if (m) m.setAttribute('content', 'width=1100');
    }
  })();
</script>
<title>車輛派遣系統整合 — 原型</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- 漢堡鈕：固定於畫面左上角，點擊收合／展開左側功能選單 -->
<button id="menu-toggle" class="menu-toggle" aria-label="切換選單">☰</button>

<div class="app">
  <!-- 側邊導覽 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">車輛派遣系統整合</div>
      <div class="sub">INTEGRATED DISPATCH · 原型 v0.1</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      純前端可動版 · 無資料庫<br>依 docs/PLAN.md 建置
    </div>
  </aside>

  <!-- 主內容 -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="topbar-title">系統儀表板</h1>
        <div class="crumb" id="topbar-crumb"></div>
      </div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="content">
      <div class="page active" id="page-dashboard"></div>
      <div class="page" id="page-engine"></div>
      <div class="page" id="page-master"></div>
      <div class="page" id="page-a_apply"></div>
      <div class="page" id="page-a_review"></div>
      <div class="page" id="page-a_dispatch"></div>
      <div class="page" id="page-a_masonry"></div>
      <div class="page" id="page-a_driver"></div>
      <div class="page" id="page-b_apply"></div>
      <div class="page" id="page-b_approve"></div>
      <div class="page" id="page-b_review"></div>
      <div class="page" id="page-b_driver"></div>
      <div class="page" id="page-c_apply"></div>
      <div class="page" id="page-c_approve"></div>
      <div class="page" id="page-c_review"></div>
      <div class="page" id="page-c_driver"></div>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast-wrap"></div>

<!-- Modal -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <button class="close-x" id="modal-close">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<!-- SweetAlert 風格確認視窗（自製、無外部相依） -->
<div class="swal-mask" id="swal-mask">
  <div class="swal-box" role="alertdialog" aria-modal="true" aria-labelledby="swal-title">
    <div class="swal-icon">?</div>
    <h3 class="swal-title" id="swal-title"></h3>
    <div class="swal-text" id="swal-text"></div>
    <div class="swal-actions">
      <button class="btn btn-primary" id="swal-ok">確定</button>
      <button class="btn btn-ghost" id="swal-cancel">取消</button>
    </div>
  </div>
</div>

<!-- Masonry：表單資訊卡自適應排版（試做）。本地 vendor（v4.2.2），載入失敗時 RENDER 會退回一般 grid -->
<script src="js/vendor/masonry.pkgd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/loadengine.js"></script>
<script src="js/moduleA.js"></script>
<script src="js/moduleB.js"></script>
<script src="js/moduleC.js"></script>
<script src="js/app.js"></script>
</body>
</html>
